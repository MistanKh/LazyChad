name: Package Release

on:
  push:
    tags:
      - 'v*'
  # Release without pushing a tag yourself (GitHub UI, mobile app, API):
  # tags the selected commit as vX.Y.Z, publishes the release, then starts the
  # AUR sync for that tag (a tag created by GITHUB_TOKEN doesn't trigger it).
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (X.Y.Z; must match .version on the selected branch)'
        required: true

permissions:
  contents: write
  actions: write

jobs:
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Resolve tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="v${INPUT_VERSION#v}"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag already exists; bump the version instead of re-releasing it."
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check version consistency
        run: bash scripts/check-version.sh "${{ steps.tag.outputs.tag }}"

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install nfpm

      - name: Build .deb package
        run: nfpm package --config nfpm.yaml --packager deb

      - name: Build .rpm package
        run: nfpm package --config nfpm.yaml --packager rpm

      - name: Generate checksums
        run: sha256sum *.deb *.rpm > SHA256SUMS && cat SHA256SUMS

      - name: Release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          notes="docs/releases/${TAG}.md"
          if [ -f "$notes" ]; then cp "$notes" release-notes.md; else : > release-notes.md; fi

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: |
            *.deb
            *.rpm
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the AUR sync
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh workflow run aur-sync.yml --ref "$TAG" --repo "$GITHUB_REPOSITORY"
