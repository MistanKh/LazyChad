name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Shell syntax
        # `bash -n a b c` only checks a; check each file.
        run: for f in bin/* install.sh scripts/*.sh tests/*.sh lazychad.install; do bash -n "$f" || exit 1; done

      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck -S warning bin/* install.sh scripts/*.sh tests/*.sh
          shellcheck -s bash -S warning lazychad.install

      - name: Shell tests
        run: for t in tests/*.sh; do echo "## $t"; bash "$t" || exit 1; done

      - name: Version consistency
        run: bash scripts/check-version.sh

      - name: StyLua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check init.lua lua

  build-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install nfpm

      - name: Build packages
        run: |
          nfpm package --config nfpm.yaml --packager deb
          nfpm package --config nfpm.yaml --packager rpm

      - uses: actions/upload-artifact@v6
        with:
          name: packages
          path: |
            *.deb
            *.rpm

  # Install, upgrade and remove the .deb; user config must survive everything
  # except an explicit purge.
  deb-lifecycle:
    needs: build-packages
    runs-on: ubuntu-latest
    container:
      image: debian:stable
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: packages

      # The published <= 1.0.9 packages wiped every user's data from their
      # postrm during upgrades; the new preinst/postinst must protect it.
      - name: Upgrade from the published v1.0.9 keeps user data
        shell: bash
        run: |
          set -eo pipefail
          apt-get update
          apt-get install -y curl ca-certificates
          curl -fsSL -o /tmp/lazychad-1.0.9.deb \
            https://github.com/MistanKh/LazyChad/releases/download/v1.0.9/lazychad_1.0.9-1_all.deb
          apt-get install -y /tmp/lazychad-1.0.9.deb
          mkdir -p /home/tester/.config/LazyChad /home/tester/.local/share/LazyChad/lazy /root/.config/LazyChad
          touch /home/tester/.config/LazyChad/mine.lua /root/.config/LazyChad/mine.lua
          # dpkg -i runs the old postrm even when the version is unchanged
          dpkg -i ./lazychad_*.deb 2>&1 | tee /tmp/upgrade.log
          # prove v1.0.9's wiping postrm really ran, so this can't pass vacuously
          grep -F "Cleaning up LazyChad user directories" /tmp/upgrade.log
          test -f /home/tester/.config/LazyChad/mine.lua
          test -d /home/tester/.local/share/LazyChad/lazy
          test -f /root/.config/LazyChad/mine.lua
          test -z "$(find /home /root -name '*.pkg-upgrade' -print -quit)"
          apt-get purge -y lazychad
          test ! -e /home/tester/.config/LazyChad

      - name: Install
        run: |
          apt-get install -y ./lazychad_*.deb
          test -x /usr/bin/lchad
          test -x /usr/bin/lazychad-deps
          test -f /usr/share/lazychad/init.lua
          test -f /usr/share/lazychad/lua/configs/bootstrap.lua

      - name: Upgrade keeps user config
        run: |
          mkdir -p /home/tester/.config/LazyChad
          touch /home/tester/.config/LazyChad/mine.lua
          apt-get install -y --reinstall ./lazychad_*.deb
          test -f /home/tester/.config/LazyChad/mine.lua

      - name: Remove keeps user config, purge deletes it
        run: |
          apt-get remove -y lazychad
          test -f /home/tester/.config/LazyChad/mine.lua
          apt-get purge -y lazychad
          test ! -e /home/tester/.config/LazyChad

  rpm-lifecycle:
    needs: build-packages
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: packages

      - name: Upgrade from the published v1.0.9 keeps user data
        shell: bash
        run: |
          set -eo pipefail
          dnf install -y https://github.com/MistanKh/LazyChad/releases/download/v1.0.9/lazychad-1.0.9-1.noarch.rpm
          mkdir -p /home/tester/.config/LazyChad /home/tester/.local/share/LazyChad/lazy
          touch /home/tester/.config/LazyChad/mine.lua
          # -U --replacepkgs works for both a same-version reinstall and a real
          # upgrade; either way the old package's wiping %postun runs
          rpm -Uvh --replacepkgs ./lazychad-*.rpm 2>&1 | tee /tmp/upgrade.log
          grep -F "Cleaning up LazyChad user directories" /tmp/upgrade.log
          test "$(rpm -q lazychad)" = "$(rpm -qp ./lazychad-*.rpm)"
          test -f /home/tester/.config/LazyChad/mine.lua
          test -d /home/tester/.local/share/LazyChad/lazy
          test -z "$(find /home -name '*.pkg-upgrade' -print -quit)"
          dnf remove -y lazychad

      - name: Install
        run: |
          dnf install -y ./lazychad-*.rpm
          test -x /usr/bin/lchad
          test -f /usr/share/lazychad/init.lua

      - name: Upgrade and remove keep user config
        run: |
          mkdir -p /home/tester/.config/LazyChad
          touch /home/tester/.config/LazyChad/mine.lua
          dnf reinstall -y ./lazychad-*.rpm
          test -f /home/tester/.config/LazyChad/mine.lua
          dnf remove -y lazychad
          test -f /home/tester/.config/LazyChad/mine.lua

  # The real user flow: install the .deb, run lazychad-deps (stable Neovim,
  # tools, plugins, Mason, parsers), then boot LazyChad and fail on any error.
  end-to-end:
    needs: build-packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: packages

      - name: Install package
        run: sudo apt-get install -y ./lazychad_*.deb

      - name: lazychad-deps
        run: lazychad-deps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stable Neovim and Nerd Font installed
        run: |
          nvim --version | head -1
          nvim --version | head -1 | grep -qv -- '-dev'
          fc-list | grep -i "JetBrainsMono Nerd Font"
          # The download must have been verified, not skipped.
          grep -F "Checksum verified." ~/.local/state/LazyChad/lazychad-deps.log

      - name: Doctor
        run: lchad --doctor

      - name: Boot without errors
        run: |
          printf 'local x = 1\nreturn x\n' > sample.lua
          lchad --headless sample.lua \
            -c 'sleep 5' \
            -c 'lua if vim.v.errmsg ~= "" then io.stderr:write("startup error: " .. vim.v.errmsg .. "\n") vim.cmd "cquit 1" end' \
            -c 'qa!'

      - name: Upload deps log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lazychad-deps-log
          path: ~/.local/state/LazyChad/lazychad-deps.log
