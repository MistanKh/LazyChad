# nfpm configuration for LazyChad
# Generates .deb and .rpm packages automatically.

name: "lazychad"
arch: "all"
platform: "linux"
version: "1.0.2"
release: "1"
section: "default"
priority: "extra"
maintainer: "Mistan Khomdram <mistankhomdram@gmail.com>"
description: "An intelligent, highly-aesthetic Neovim wrapper built on NvChad"
vendor: "LazyChad"
homepage: "https://github.com/MistanKh/LazyChad"
license: "MIT"

contents:
  # Binaries
  - src: ./bin/lchad
    dst: /usr/bin/lchad
  - src: ./bin/lazychad-deps
    dst: /usr/bin/lazychad-deps
  
  # Core Config Files
  - src: ./init.lua
    dst: /usr/share/lazychad/init.lua
  - src: ./lua
    dst: /usr/share/lazychad/lua
  - src: ./.version
    dst: /usr/share/lazychad/.version
  
  # Metadata
  - src: ./README.md
    dst: /usr/share/doc/lazychad/README.md
  - src: ./LICENSE
    dst: /usr/share/licenses/lazychad/LICENSE

scripts:
  # Using the existing logic for user-side cleanup if desired
  # but native packages usually don't touch home dirs.
  # We'll stick to a simple post-install notification for now.
  postinstall: ./scripts/linux-postinstall.sh
  postremove: ./scripts/linux-postremove.sh

# Dependencies that exist across Arch, Debian, and Fedora
depends:
  - git
  - ripgrep
  - curl
  - bash
  - make
  - unzip
  - gcc

# neovim is intentionally NOT a hard dependency on Debian/Kali.
# Kali's repo neovim is too old for nvim-treesitter (needs 0.12+), so users
# install the latest via Kali-Scripts to /usr/local. A hard `Depends: neovim`
# would make apt cascade-remove LazyChad when that repo package is removed, and
# drag the stale package back on reinstall. `lazychad-deps` ensures a new-enough
# nvim is present; this only expresses a soft preference.
recommends:
  - neovim
